name: Verify book video route
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-book-video.yml]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the branded book deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --max-time 10 https://book-space-gold.vercel.app/ | grep -q 'WIZZ LAB STUDIOS'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Check video origin and same-site test route
        shell: bash
        run: |
          set -euo pipefail
          for video_url in https://media.w-i-z-z-lab-studios.com/space-junkz/background_video2.mp4 https://book-space-gold.vercel.app/test-media/background.mp4; do
            echo "Checking $video_url"
            curl --silent --show-error --connect-timeout 10 --max-time 30 --range 0-1023 --header 'Origin: https://book-space-gold.vercel.app' --dump-header - --output /tmp/book-video-test.bin "$video_url"
            wc -c /tmp/book-video-test.bin
          done
