name: Read original book assets
on:
  push:
    branches: [main]
    paths: [.github/workflows/read-original-assets.yml]
permissions:
  contents: read
jobs:
  read-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public upstream images without modifying this repository
        shell: bash
        run: |
          set -euo pipefail
          git init original
          git -C original fetch --depth 1 https://github.com/pakagronglb/animated-book-slider-threejs.git 3dd1a49855e7f74f4a2b86c705910d7284cc5c52
          git -C original checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ['image.png', 'public/images/banner.jpeg', 'public/textures/DSC00993.jpg']:
              encoded = base64.b64encode((Path('original') / name).read_bytes()).decode()
              print('BOOK_ASSET_BEGIN ' + name)
              for offset in range(0, len(encoded), 2000):
                  print('BOOK_ASSET_CHUNK ' + name + ' ' + str(offset // 2000) + ' ' + encoded[offset:offset+2000])
              print('BOOK_ASSET_END ' + name)
          PY
